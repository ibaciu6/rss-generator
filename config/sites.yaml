    # comments and the Akismet notice around the real body, so the reader showed
    # the headline twice and carried the theme chrome. .post-content is the body
    # alone. The EUROCHARGE sponsor block uses Tailwind-hashed classes, so it is
    # matched on its text instead.
    detail_article_selector: .post-content
    removals:
    - cosmetic-filters
    - comments
    - akismet-notice
    - sponsor-block
    - emoji-images
    - head-meta
