    method: rss
    feed_file: printesa-urbana.xml
    category: blogs
    language: ro
    max_items: 20
    # extract_main_content tries `article` before `.entry-content`, so the
    # author-box (bio + "Articole: 4444") and the post-navigation both came
    # along. .entry-content is the body alone.
    detail_article_selector: .entry-content
    removals:
    - cosmetic-filters
    - emoji-images
    - head-meta
    - post-navigation
    - author-box

  hoinaru:
    display_name: hoinaru
    url: https://feeds.feedburner.com/hoinaru
    method: rss
    feed_file: hoinaru.xml
    category: blogs
    language: ro
    max_items: 20
    # WordPress/WPBakery theme. Without the detail selector, extraction matches
    # the whole page - including a <style> block that is most of the document -
    # and the result lands just over MAX_DESCRIPTION_LENGTH, so every item was
    # skipped and the feed shipped excerpts. The related-posts block is a
    # sibling inside the content div, so it needs its own selector.
    detail_article_selector: div.w-post-elm.post_content
    ad_selectors:
    - .ad
    - .ad-container
    - .advertisement
    - "#sidebar"
    - .sidebar
    - .social-share
    - .comments
    - .related-posts
    - div.crp_related

    removals:
    - cosmetic-filters
