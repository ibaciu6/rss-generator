sites:
  seriale-online-episodes:
    display_name: Seriale-Online.net Episodes
    url: https://seriale-online.net/episoade/
    method: playwright
    item_selector: /html/body/div/div/div/div/div/article/div
    title_selector: concat(substring-before(./img/@title, ' Sezonul '), ' - ', substring-after(substring-before(./img/@title,
      ' Episodul'), ' Sezonul '), 'x', substring-after(substring-before(./img/@title,
      ' FSonline'), ' Episodul '))
    link_selector: ./a/@href
    description_selector: concat('<img src="', ./img/@src, '" alt="', substring-before(./img/@title,
      ' Sezonul '), ' Poster" style="max-width:300px;max-height:450px;width:auto;height:auto;object-fit:contain;display:block;border-radius:4px;">',
      '<br><a href="https://www.youtube.com/results?search_query=', encode-for-uri(substring-before(./img/@title,
      ' Sezonul ')), '+preview%7Cpromo%7Ctrailer+-fake+-fan&sp=EgIYAQ%253D%253D" target="_blank"
      rel="noopener noreferrer"><b style="color:#6600cc;">Trailer</b></a><br>', '<a
      href="https://www.imdb.com/find?q=', encode-for-uri(substring-before(./img/@title,
      ' Sezonul ')), '&s=tt&ttype=tv" target="_blank" rel="noopener noreferrer"><b
      style="color:#6600cc;">IMDb</b></a>')
    feed_file: seriale-online-episodes.xml
    kind: series
    category: episodes
    language: ro
  seriale-online-movies:
    display_name: Seriale-Online.net
    url: https://seriale-online.net/filme/
    method: playwright
    item_selector: /html/body/div/div/div/div/div/article/div
    title_selector: substring-before(./img/@title, ' Online Subttirat - FSonline')
    link_selector: ./a/@href
    description_selector: concat('<img src="', ./img/@src, '" alt="', substring-before(./img/@title,
      ' Online Subttirat - FSonline'), ' Poster" style="max-width:300px;max-height:450px;width:auto;height:auto;object-fit:contain;display:block;border-radius:4px;">',
      '<br><a href="https://www.youtube.com/results?search_query=', encode-for-uri(substring-before(./img/@title,
      ' Online Subttirat - FSonline')), '+preview%7Cpromo%7Ctrailer+-fake+-fan&sp=EgIYAQ%253D%253D"
      target="_blank" rel="noopener noreferrer"><b style="color:#6600cc;">Trailer</b></a><br>',
      '<a href="https://www.imdb.com/find?q=', encode-for-uri(normalize-space(substring-before(./img/@title,
      ' Online Subttirat - FSonline'))), '&s=tt&ttype=ft" target="_blank" rel="noopener
      noreferrer"><b style="color:#6600cc;">IMDb</b></a>')
    feed_file: seriale-online-movies.xml
    kind: movie
    category: movies
    language: ro
  fsonline-episoade:
    display_name: Fsonline episodes
    url: https://www3.fsonline.app/episoade/
    method: playwright
    required_content_marker_groups:
    - - item se
      - ep-title
    - - item se
    playwright_wait_selector: h3.ep-title
    item_selector: //article[contains(@class,'item')]
    title_selector: concat(substring-before(normalize-space(.//h3[contains(@class,'ep-title')]/text()),
      ' Sezonul '), ' - ', normalize-space(substring-before(substring-after(normalize-space(.//h3[contains(@class,'ep-title')]/text()),
      'Sezonul '), ' Episodul ')), 'x', normalize-space(substring-after(normalize-space(.//h3[contains(@class,'ep-title')]/text()),
      'Episodul '))) || normalize-space(.//h3[contains(@class,'ep-title')]/text())
      || normalize-space(.//h3/a/text())
    link_selector: normalize-space(.//div[contains(@class,'poster')]/a/@href) || normalize-space(.//h3/a/@href)
    description_selector: concat('<img src="', normalize-space(if (string-length(normalize-space(.//img/@data-src))
      > 0) then .//img/@data-src else .//img/@src), '" style="max-width:300px;max-height:450px;width:auto;height:auto;object-fit:contain;display:block;border-radius:4px;">',
      '<br><a href="https://www.youtube.com/results?search_query=', encode-for-uri(normalize-space(substring-before(normalize-space(.//h3[contains(@class,'ep-title')]/text()),
      ' Sezonul '))), '+preview%7Cpromo%7Ctrailer+-fake+-fan&sp=EgIYAQ%253D%253D"
      target="_blank" rel="noopener noreferrer"><b style="color:#6600cc;">Trailer</b></a>',
      '<br><a href="https://www.imdb.com/find?q=', encode-for-uri(normalize-space(substring-before(normalize-space(.//h3[contains(@class,'ep-title')]/text()),
      ' Sezonul '))), '&s=tt&ttype=tv" target="_blank" rel="noopener noreferrer"><b
      style="color:#6600cc;">IMDb</b></a>')
    feed_file: fsonline-episoade.xml
    kind: series
    category: episodes
    max_items: 24
    language: ro
  fsonline-film:
    display_name: FSOnline
    url: https://www3.fsonline.app/film/
    method: playwright
    required_content_marker_groups:
    - - item movies
    - - article
      - movies
    playwright_wait_selector: article.item.movies
    item_selector: //article[contains(@class,'item') and contains(@class,'movies')]
    title_selector: normalize-space(.//div[contains(@class,'data')]//h3/text())
    link_selector: normalize-space((.//div[contains(@class,'poster')]//a/@href)[1])
    description_selector: concat('<img src="', normalize-space(if (string-length(normalize-space(.//div[contains(@class,"poster")]//img/@data-src))
      > 0) then .//div[contains(@class,"poster")]//img/@data-src else .//div[contains(@class,"poster")]//img/@src),
      '" style="max-width:300px;max-height:450px;width:auto;height:auto;object-fit:contain;display:block;border-radius:4px;">',
      '<br><a href="https://www.youtube.com/results?search_query=', encode-for-uri(normalize-space(.//div[contains(@class,'data')]//h3/text())),
      '+preview%7Cpromo%7Ctrailer+-fake+-fan&sp=EgIYAQ%253D%253D" target="_blank"
      rel="noopener noreferrer"><b style="color:#6600cc;">Trailer</b></a>', '<br><a
      href="https://www.imdb.com/find?q=', encode-for-uri(normalize-space(.//div[contains(@class,'data')]//h3/text())),
      '&s=tt" target="_blank" rel="noopener noreferrer"><b style="color:#6600cc;">IMDb</b></a>')
    feed_file: fsonline-film.xml
    kind: movie
    category: movies
    max_items: 24
    language: ro
