    url: https://www.gabrielursan.ro/feed/
    method: rss
    feed_file: gabriel-ursan.xml
    category: blogs
    language: ro
    max_items: 20
    fallback_urls:
    - https://gabrielursan.ro/feed/
    # The body lives in div.articol-continut. Without this, extract_main_content
    # matches <article>, whose other children are all theme chrome: a <header>
    # that repeats the H1 title (so the reader shows the headline twice), the
    # share navs, a byline/date/read-time line, prev-next links, the comment
    # section and the newsletter pitch.
    detail_article_selector: .articol-continut
    # Belt and braces for the theme chrome above. Redundant while
    # detail_article_selector holds, but they still apply on the fallback path
    # (where the whole page is cleaned) and if the body ever moves. Every one is
    # class-scoped - a bare `nav`/`section` would delete article content.
    ad_selectors:
    - .ad
    - .ad-container
    - .advertisement
    - "#sidebar"
    - .sidebar
    - .social-share
    - .comments
    - .related-posts
    - aside.promo-articol
    - aside.abonare-articol
    - aside.card-autor
    - aside.promo
    - nav.partajare
    - nav.partajare.compacta
    - nav.taguri
    - nav.vecini
    - section.inscriere
    - section.comentarii

    removals:
    - cosmetic-filters
  manafu:
    display_name: M A N A F U *
    url: https://feeds.feedburner.com/blogspot/manafu?format=xml
    method: rss
    feed_file: manafu.xml
    category: blogs
    language: ro
    max_items: 20
    # WordPress theme. Without the detail selector, extraction matches .content,
    # which wraps the title, byline, share buttons and tags around the body - so
    # the reader showed the headline twice and carried the theme chrome. .entry
    # is the body alone. The related-posts block sits inside it.
    detail_article_selector: .entry
    ad_selectors:
    - .ad
    - .ad-container
    - .advertisement
    - "#sidebar"
    - .sidebar
    - .social-share
    - .comments
    - .related-posts
    - div.crp_related

    removals:
    - cosmetic-filters
  printesa-urbana:
    display_name: Printesa Urbana
