[project]
name = "rss-generator"
version = "0.1.0"
description = "Config-driven RSS & Atom generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Ionut Baciu", email = "6958764+ibaciu6@users.noreply.github.com" }]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["BLE001", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

