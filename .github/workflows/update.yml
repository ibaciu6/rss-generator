# Generates feeds, commits updates, uploads the Pages artifact, and deploys.
# The separate "pages build deployment" run in the Actions UI is GitHub’s
# built-in companion to actions/deploy-pages — it is not a workflow file here.
name: Update RSS and Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Inoreader documents ~hourly polling for most feeds (not faster than ~30 min);
    # WebSub (pinged after deploy) lets them fetch less often. One run/hour avoids
    # overlapping crons that could trigger multiple scrapes in the same hour.
    # https://www.inoreader.com/feed-fetcher
    - cron: "19 * * * *" # every hour at :19 UTC
  workflow_dispatch:

env:
  # Feeds are published to `main` and read from raw (see the commit step below:
  # "Publish feeds to the raw branch"). The base feeds the absolute
  # `<atom:link rel="self">` written into every feed, so a reader that follows
  # the self link lands on the same raw URLs the OPML/index hand out, not on the
  # Pages copy behind its CDN cache.
  RSS_FEED_PUBLIC_BASE: https://raw.githubusercontent.com/ibaciu6/rss-generator/main
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    # Feed generation uses Playwright for several sites; cap total wall time.
    timeout-minutes: 45
    # contents: write lets the job publish the generated feeds back to `main`
    # (see "Publish feeds to the raw branch"). It is the ONLY writer; a local
    # run never pushes a feed.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
          cache: pip

      # Avoid re-downloading Chromium (~170 MB) on every hourly run.
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Persist the TMDb result cache across runs so posters/years fetched
      # today serve tomorrow's feeds (same movies/series posted across sites)
      # without repeating API calls. Restored before enrich, saved at job end.
      - name: Cache TMDb lookups
        uses: actions/cache@v6
        with:
          path: data/tmdb_cache.json
          key: tmdb-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tmdb-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. python -m pytest tests/ -q

      # playwright install chromium is fast when correct version cached,
      # and automatically downloads the right one if the resolved version
      # changed (requirements.txt `>=` allows unpinned bumps).
      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Install Playwright OS deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install-deps chromium

      - name: Random startup delay
        if: github.event_name == 'schedule'
        run: |
          # Random delay 0-60 seconds before starting to avoid predictable timing
          DELAY=$((RANDOM % 60))
          echo "Waiting ${DELAY}s before feed generation..."
          sleep $DELAY

      # The checkout carries the previous run's feeds (they are committed to
      # `main`), so generation updates them in place rather than rebuilding from
      # an empty directory: a feed whose source answered is overwritten, one
      # whose source failed transiently keeps its last published copy -- no gap
      # for readers -- and only a source the engine declares dead is deleted.
      - name: Generate RSS feeds
        id: generate_feeds
        continue-on-error: true
        env:
          RSS_GENERATOR_PROXY_URL: ${{ secrets.RSS_GENERATOR_PROXY_URL }}
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/generate_feeds.py 2>&1 | tee feed_generation.log

      - name: Enrich feeds (TMDb posters, full article content)
        if: steps.generate_feeds.outcome == 'success'
        env:
          # Every article body is fetched here, and article pages are refused
          # more readily than feed URLs -- hackread serves its feed with a 200
          # and 403s its articles from a datacenter address. The generate step
          # already had this; without it here, setting the secret only fixed
          # half the pipeline and the symptom was a feed full of site excerpts.
          RSS_GENERATOR_PROXY_URL: ${{ secrets.RSS_GENERATOR_PROXY_URL }}
        run: |
          # pipefail, so tee cannot swallow a real failure -- and the log is
          # kept because the one number worth watching run-over-run is how many
          # items kept only their site's own excerpt. Nothing downstream can
          # see that: the feeds look identical either way.
          set -o pipefail
          PYTHONPATH=. python scripts/enrich_feeds.py 2>&1 | tee enrich.log

      - name: Post-process feeds (year format, link fixes, poster styling)
        if: steps.generate_feeds.outcome == 'success'
        run: PYTHONPATH=. python scripts/fix_feeds.py

      - name: Collect generation failures
        if: always()
        run: |
          mkdir -p logs
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          failures: list[str] = []
          log_path = Path("feed_generation.log")
          if log_path.exists():
              for raw_line in log_path.read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      payload = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if payload.get("event") == "site.error":
                      failures.append(f"{payload.get('site')}: {payload.get('error')}")
          else:
              failures.append("(runner): feed_generation.log missing — generate step failed before log was written")

          output = "\n".join(failures)
          if output:
              output += "\n"
          Path("logs/failed_feeds.txt").write_text(output, encoding="utf-8")
          PY
          echo "Failed feeds:"
          cat logs/failed_feeds.txt || true
          find feeds/ -name "*.xml" -size 0 -delete

      - name: Upload feed generation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feed-generation-${{ github.run_id }}
          path: |
            feed_generation.log
            enrich.log
            logs/failed_feeds.txt
          if-no-files-found: warn

      # Generate + deploy the stats page on every run that produced ANY feed file,
      # so the page always reflects the latest run's results and is never stale.
      # (Gated on feed files existing, not on the generate step's exit code, so a
      # hard crash that writes nothing still keeps the last good deployment.)
      - name: Check for generated feeds
        id: check_feeds
        if: always()
        run: |
          COUNT=$(find feeds -name "*.xml" | wc -l)
          echo "feed_files=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Generate index
        if: steps.check_feeds.outputs.feed_files != '0'
        continue-on-error: true
        run: PYTHONPATH=. python scripts/generate_index.py

      # The static reader: the same page scripts/local_reader.py serves
      # locally, with its data layer swapped for one that reads
      # feeds/manifest.json + feeds/<file>.xml in the browser. Depends on the
      # feeds (step above) and writes into feeds/, so it must run after them.
      - name: Generate reader page
        if: steps.check_feeds.outputs.feed_files != '0'
        run: PYTHONPATH=. python scripts/generate_reader.py

      # In-place updates leave one loose end the old wipe handled: a feed whose
      # site was removed, renamed or disabled is never touched, so it would sit
      # on `main` (and on raw) forever. Drop feeds no enabled site claims. This
      # is the only deletion the run does outside the engine's own dead- and
      # stale-source rules.
      - name: Remove feeds for sites no longer configured
        if: steps.check_feeds.outputs.feed_files != '0'
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from core.config import load_config

          keep = {
              s.feed_file
              for s in load_config(Path("config/sites.yaml")).sites
              if s.enabled
          }
          removed = []
          for path in sorted(Path("feeds").glob("*.xml")):
              if path.name not in keep:
                  path.unlink()
                  removed.append(path.name)
          print(f"orphan sweep removed {len(removed)}: {', '.join(removed) or '-'}")
          PY

      # Publish the generated feeds back to `main`, where raw.githubusercontent.com
      # serves them. feeds.opml, index.html and the reader all point at the raw
      # URLs, and raw is a plain Git CDN rather than the Pages CDN, so a reader
      # polling a feed is not stuck behind the Pages cache.
      #
      # The push is a single atomic commit that merges this run's changes onto
      # the previous set: updated feeds replace their old copy, a feed whose
      # source failed transiently is absent from the diff and its last published
      # copy keeps serving, and only a dead/stale or unconfigured feed is
      # removed. `main` never shows a half-updated or emptied set, so there is no
      # window where a reader cannot fetch a feed.
      #
      # Only feeds/*.xml and feeds.opml are committed. index.html, reader.html
      # and feeds/manifest.json are Pages-only build artifacts and stay untracked.
      #
      # This is the one and only place a feed is committed; local runs only ever
      # write feeds into the working tree. `feeds/` is gitignored, so `git add .`
      # in a local run cannot stage a feed the job has not already put on `main`.
      # (Once the job has committed one it is tracked and gitignore no longer
      # hides it, so never stage a feed by hand -- the hourly run is the writer.)
      #
      # The push is made with the job's GITHUB_TOKEN, and GitHub does not start
      # workflow runs for pushes made with that token, so it cannot retrigger
      # this workflow (the `[skip ci]` tag documents the same intent). `-f` is
      # required because feeds/ is gitignored; `git add -u` picks up feeds the
      # engine deleted this run (dead or stale sources).
      - name: Publish feeds to the raw branch
        if: steps.check_feeds.outputs.feed_files != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 'feeds/*.xml'
          # feeds.opml comes from generate_index, which is continue-on-error; if
          # it did not write one, publish the feeds that exist rather than fail.
          if [ -f feeds.opml ]; then git add -f feeds.opml; fi
          git add -u feeds
          if git diff --cached --quiet; then
            echo "No feed changes to publish."
          else
            git commit -m "chore(feeds): update generated feeds [skip ci]"
            # The "pages" concurrency group (cancel-in-progress) serialises
            # runs, so a race with another writer is unlikely. If the remote
            # did move, warn and let the next run republish instead of failing
            # the job (which would skip the Pages deploy).
            if ! git push; then
              echo "::warning::Could not push regenerated feeds (remote moved). They will publish on the next run."
            fi
          fi

      - name: Prepare Pages artifact
        if: steps.check_feeds.outputs.feed_files != '0'
        run: |
          rm -rf .site
          mkdir -p .site
          cp index.html .site/
          cp feeds.opml .site/
          # Without reader.html the index's "Open the reader" button 404s.
          if [ -f reader.html ]; then
            cp reader.html .site/
          else
            echo "::warning::reader.html was not generated - the index button will 404 until the next run"
          fi
          cp -R feeds .site/
          if [ -f .nojekyll ]; then
            cp .nojekyll .site/
          fi

      - name: Configure GitHub Pages
        if: steps.check_feeds.outputs.feed_files != '0'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.check_feeds.outputs.feed_files != '0'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site

      - name: Flag feed generation crash
        if: steps.generate_feeds.outcome != 'success'
        run: |
          echo "::warning::Feed generation crashed — page still deployed with last feed files. Download artifact feed-generation-${{ github.run_id }} for feed_generation.log and failed_feeds.txt"

      - name: Upload empty-slug stats check
        if: steps.check_feeds.outputs.feed_files == '0'
        run: echo "::warning::No feed files generated this run — skipping page rebuild to keep last good deployment."

  deploy:
    runs-on: ubuntu-latest
    needs: generate-and-publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout for feed list
        uses: actions/checkout@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Ping WebSub hub for real-time updates
        run: |
          # The OPML, index and reader all hand out the raw.githubusercontent.com
          # feed URLs, so the hub must be told about those exact topics --
          # pinging the Pages copies would notify nobody who subscribed.
          FEED_BASE="https://raw.githubusercontent.com/ibaciu6/rss-generator/main/feeds"
          HUB_URL="https://pubsubhubbub.appspot.com/"
          
          echo "Notifying WebSub hub of updated feeds..."
          python -m pip install --quiet --disable-pip-version-check PyYAML
          for feed_name in $(PYTHONPATH=. python -c 'from core.config import load_config; from pathlib import Path; print(" ".join(site.feed_file for site in load_config(Path("config/sites.yaml")).sites if site.enabled))'); do
            feed_url="${FEED_BASE}/${feed_name}"
            echo "Pinging hub for: $feed_url"
            curl -s -X POST "$HUB_URL" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "hub.mode=publish" \
              --data-urlencode "hub.url=$feed_url" \
              && echo " -> OK" || echo " -> Failed (non-critical)"
          done
          echo "WebSub hub notifications complete."
