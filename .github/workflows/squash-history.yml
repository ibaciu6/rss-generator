name: Squash history

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday at 03:00 UTC
  workflow_dispatch:       # allow manual trigger

jobs:
  squash:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip protected-branch squash
        run: |
          echo "main is protected, so weekly force-push squash is disabled."
          echo "No changes were made."
