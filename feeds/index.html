<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS Feeds</title>
<style>
  :root{--bg:#f5f1e8;--panel:#fffaf0;--text:#1f2933;--muted:#52606d;--line:#d9cbb2;--accent:#9f3a16}
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);padding:16px 20px}
  h1{font-size:1.2rem;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  .feeds{display:flex;flex-direction:column;gap:6px}
  a{color:var(--accent);text-decoration:none;font-size:0.95rem;display:block;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
  a:hover{background:#ede4d4}
  .back{margin-bottom:12px}
  .back a{display:inline-block;padding:4px 12px;font-size:0.82rem;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--accent);text-decoration:none}
  .back a:hover{background:#ede4d4}
</style></head><body>
<div class="back"><a href="../">&larr; Dashboard</a></div>
<h1>RSS Feeds</h1>
<div class="feeds" id="list"></div>
<script>
fetch('../feeds.opml').then(r=>r.text()).then(xml=>{
  const parser=new DOMParser(),doc=parser.parseFromString(xml,'text/xml');
  const outlines=Array.from(doc.querySelectorAll('outline[type="rss"]'));
  const list=document.getElementById('list');
  outlines.sort((a,b)=>a.getAttribute('title').localeCompare(b.getAttribute('title')));
  outlines.forEach(o=>{
    const feedUrl=o.getAttribute('xmlUrl');
    const name=o.getAttribute('title')||feedUrl;
    const div=document.createElement('div');
    const link=document.createElement('a');
    link.href=feedUrl||'#';
    link.textContent=name;
    div.appendChild(link);
    list.appendChild(div);
  });
  if(!outlines.length) list.innerHTML='<div style="color:var(--muted)">No feeds found</div>';
}).catch(()=>{
  document.getElementById('list').innerHTML='<div style="color:var(--muted)">Could not load feed list.</div>';
});
</script></body></html>
