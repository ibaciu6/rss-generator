<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        a { color: #007bff; }
    </style>
</head>
<body>
    <p>
        The player moved to
        <a id="link" href="https://ibaciu6.github.io/player/">ibaciu6.github.io/player/</a>.
    </p>
    <noscript><p>Player links published before the move point here; open the link above and the query string will carry the episode over.</p></noscript>
    <script>
        // Forwarder only. `player/index.html` in this repository is the player
        // itself (the user site pulls it from raw); this file is what the
        // project Pages deploy puts at `rss-generator/player/index.html`, so a
        // link shared before the move still plays instead of 404ing.
        // `replace` so the stub does not stay in history behind the player.
        const NEW_PLAYER_URL = 'https://ibaciu6.github.io/player/';
        document.getElementById('link').href =
            NEW_PLAYER_URL + window.location.search + window.location.hash;
        window.location.replace(NEW_PLAYER_URL + window.location.search + window.location.hash);
    </script>
</body>
</html>
