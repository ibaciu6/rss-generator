<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Player - RSS Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
            border-bottom: 1px solid #333;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            min-height: 60px;
            z-index: 100;
        }
        .logo {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            margin-right: 8px;
        }
        .server-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1;
        }
        .server-btn {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .server-btn:hover {
            background: #252525;
            border-color: #555;
        }
        .server-btn.active {
            background: #6600cc;
            border-color: #6600cc;
            color: #fff;
            font-weight: 500;
        }
        .info {
            /* Its own line at the right edge of the header: the title, its
               folded year and the episode have to be readable in full, so
               nothing here truncates. */
            flex-basis: 100%;
            text-align: right;
            font-size: 12px;
            color: #888;
        }
        .player-container {
            flex: 1;
            position: relative;
            background: #000;
        }
        #player {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 14px;
        }
        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff6b6b;
            display: none;
        }
        .external-links {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        /* A new-tab entry beside the iframe buttons: same shape as .server-btn,
           so the row reads as one group, and the arrow is what tells them apart. */
        .external-link {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .external-link:hover {
            background: #252525;
            border-color: #555;
        }
        .open-fallback {
            position: absolute;
            top: 12px;
            right: 16px;
            display: none;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            text-decoration: none;
            z-index: 10;
        }
        .open-fallback:hover {
            background: #252525;
            border-color: #555;
        }
        /* Manual lookup: its own line under the info, prefilled from the query
           string so it doubles as an editable form of the current URL. */
        .manual {
            flex-basis: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            font-size: 12px;
            color: #888;
        }
        .manual label {
            display: flex;
            gap: 4px;
            align-items: center;
            white-space: nowrap;
        }
        .manual input,
        .manual select {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 4px 6px;
            font: inherit;
        }
        .manual input:focus,
        .manual select:focus {
            outline: none;
            border-color: #6600cc;
        }
        .manual input[name="tmdb"],
        .manual input[name="imdb"] {
            width: 9em;
        }
        .manual input[name="season"],
        .manual input[name="episode"] {
            width: 3.5em;
        }
        /* The page-URL row is a line of its own: it carries a whole TMDb path, so
           the box gets the room the id fields do not need, and the ids row stays
           compact. `flex-basis: 100%` is what breaks it inside the wrapping form.
           It starts hidden and only the frame's own address brings it back — and
           `[hidden]` has to win over the `display: flex` above. */
        .manual-page {
            flex-basis: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        .manual-page[hidden] {
            display: none;
        }
        .manual input[name="pageurl"] {
            width: 26em;
        }
        .manual button {
            padding: 4px 12px;
        }
        /* Setup box for userscript installation — sits after the button
           on the same line as the page URL field and the Get the TMDb id
           button, so the row reads field, button, then the way out of
           pasting. */
        .setup-box {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 4px 10px;
        }
        .setup-label {
            color: #888;
            font-size: 11px;
            white-space: nowrap;
        }
        /* The two install entries: same shape as the controls beside them,
           at the row's own 12px, and the arrow is what says they leave the page. */
        .manual-link {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .manual-link:hover {
            background: #252525;
            border-color: #555;
        }
        .manual-hint {
            color: #ff6b6b;
        }
        .manual-hint:empty {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Player</div>
        <div class="server-buttons" id="serverButtons"></div>
        <div class="external-links" id="externalLinks"></div>
        <div class="info" id="info"></div>
        <form class="manual" id="manual" method="get" autocomplete="off">
            <span class="manual-hint" id="manualHint"></span>
            <label>TMDb <input name="tmdb" inputmode="numeric" pattern="\d*" placeholder="1038392"></label>
            <label>IMDb <input name="imdb" pattern="(tt)?\d+" placeholder="tt22898462"></label>
            <label>Type
                <select name="type">
                    <option value="movie">Movie</option>
                    <option value="tv">TV</option>
                </select>
            </label>
            <span id="manualEpisode" hidden>
                <label>Season <input name="season" inputmode="numeric" pattern="\d*"></label>
                <label>Episode <input name="episode" inputmode="numeric" pattern="\d*"></label>
            </span>
            <button type="submit" class="server-btn">Load</button>
            <span class="manual-page" hidden>
                <label title="A page open inside the frame cannot be read from here — the same-origin policy hides a cross-origin frame's address — so this takes the URL pasted in, or the one you copied. With the TMDb frame reporter userscript installed, the button asks the frame itself instead. It is emptied whenever the frame moves, so a click never reads back the page you started on.">
                    TMDb page <input name="pageurl" placeholder="paste URL or just press Get TMDb id (if script installed)" spellcheck="false">
                </label>
                <button type="button" id="grabPage" class="server-btn" title="Clear the lookup fields, then read the id, type, season and episode out of the TMDb page open in the frame (with the reporter userscript installed), or out of the page URL above, or your clipboard when the box is empty.">Get the TMDb id</button>
                <div class="setup-box">
                    <span class="setup-label">Setup:</span>
                    <a class="manual-link" id="tampermonkeyLink" href="https://www.tampermonkey.net/" target="_blank" rel="noopener noreferrer" title="Tampermonkey is the userscript manager that runs the reporter script, and the one its install page is written for. Violentmonkey runs it too.">Tampermonkey &#8599;</a>
                    <a class="manual-link" id="reporterLink" href="https://raw.githubusercontent.com/ibaciu6/rss-generator/main/player/tmdb-frame-reporter.user.js" target="_blank" rel="noopener noreferrer" title="Install the TMDb frame reporter userscript: with it running inside the frame, Get the TMDb id reads the page you are on instead of asking you to copy its address.">Reporter script &#8599;</a>
                </div>
            </span>
        </form>
    </header>
    <div class="player-container">
        <iframe id="player" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
        <div class="loading" id="loading">Loading...</div>
        <div class="error" id="error">
            <div>No player servers available or missing parameters.</div>
            <div style="margin-top: 8px; font-size: 12px;">Add ?tmdb=ID or ?imdb=tt... and &type=movie|tv</div>
        </div>
        <a class="open-fallback" id="openFallback" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
    </div>

    <script>
        const PLAYER_SERVERS = {
            cinesrc: {
                label: "CineSrc",
                movie_url: "https://cinesrc.st/embed/movie/{tmdb}",
                tv_url: "https://cinesrc.st/embed/tv/{tmdb}?s={season}&e={episode}",
                tv_series_url: "https://cinesrc.st/embed/tv/{tmdb}",
                id_type: "tmdb"
            },
            vidsrc: {
                label: "VidSrc",
                movie_url: "https://vidsrc.to/embed/movie/{imdb}",
                tv_url: "https://vidsrc.to/embed/tv/{imdb}/{season}/{episode}",
                tv_series_url: "https://vidsrc.to/embed/tv/{imdb}",
                id_type: "imdb_or_tmdb",
                needs_imdb: true
            },
            vidsrc_buzz: {
                label: "VidSrc.buzz",
                movie_url: "https://vidsrc.buzz/embed/movie/{tmdb}?autoplay=true",
                tv_url: "https://vidsrc.buzz/embed/tv/{tmdb}/{season}/{episode}?autoplay=true",
                id_type: "tmdb"
            },
            vidlink: {
                label: "VidLink",
                movie_url: "https://vidlink.pro/movie/{tmdb}?autoplay=true",
                tv_url: "https://vidlink.pro/tv/{tmdb}/{season}/{episode}?autoplay=true",
                id_type: "tmdb"
            },
            vembed: {
                label: "VEmbed",
                movie_url: "https://vsembed.ru/embed/movie/{tmdb}?autoplay=1",
                tv_url: "https://vsembed.ru/embed/tv/{tmdb}?s={season}&e={episode}&autoplay=1",
                id_type: "tmdb"
            },
            vidnest: {
                label: "VidNest",
                movie_url: "https://vidnest.fun/movie/{tmdb}?autoplay=1",
                tv_url: "https://vidnest.fun/tv/{tmdb}/{season}/{episode}?autoplay=1",
                id_type: "tmdb"
            },
            vidfast: {
                label: "VidFast",
                movie_url: "https://vidfast.vc/movie/{tmdb}?autoPlay=true",
                tv_url: "https://vidfast.vc/tv/{tmdb}/{season}/{episode}?autoPlay=true",
                id_type: "tmdb"
            },
            "2embed": {
                label: "2Embed",
                movie_url: "https://2embed.cc/embed/movie/{tmdb}",
                tv_url: "https://2embed.cc/embed/tv/{tmdb}/{season}/{episode}",
                tv_series_url: "https://2embed.cc/embed/tv/{tmdb}",
                id_type: "tmdb"
            },
            // vidspark.to (the vidora family's own host; moviesapi.to and
            // cdn.vidspark.to both land here too). TMDb ids in the path,
            // /tv/:id/:season/:episode only — no series page. Plays movies and
            // TV framed by this page (measured 2026-11-11), but each play
            // interaction opens one popup ad, so it sits with the ad-bearing
            // servers.
            vidspark: {
                label: "VidSpark",
                movie_url: "https://vidspark.to/movie/{tmdb}",
                tv_url: "https://vidspark.to/tv/{tmdb}/{season}/{episode}",
                id_type: "tmdb"
            },
            "medmedia03": {
                label: "MedMedia03",
                movie_url: "https://1.medmedia03.wiki/embed/movie/{tmdb}",
                tv_url: "https://2.medmedia03.wiki/embed/tv/{tmdb}/{season}/{episode}",
                tv_series_url: "https://1.medmedia03.wiki/embed/tv/{tmdb}",
                id_type: "tmdb"
            },
            // cdnm.ink is the embed backend the Romanian feed sites frame
            // (HAR-verified 2026-11-11): share.cdnm.ink wraps a
            // cdnmovies-stream.online inner player and serves the m3u8 from
            // s1.cdnmvs.online. Popup-free, like medmedia03 — but movies only,
            // keyed by a real IMDb id (its /embed/tmdb/ shape 200s and plays
            // nothing, and no TV shape exists across all eight HARs), so it
            // has no TV templates at all and hides on TV pages.
            cdnm: {
                label: "cdnm.ink",
                movie_url: "https://share.cdnm.ink/embed/imdb/{imdb}",
                id_type: "imdb",
                needs_imdb: true
            },
            "vidapi": {
                label: "VidAPI",
                movie_url: "https://vidapi.xyz/embed/movie/{imdb}",
                tv_url: "https://vidapi.xyz/embed/tv/{imdb}/{season}/{episode}",
                tv_series_url: "https://vidapi.xyz/embed/tv/{imdb}",
                id_type: "imdb",
                needs_imdb: true
            },
            // Metadata pages. TMDB and EpGuides frame like the media servers.
            // IMDb cannot: its AWS WAF challenge never completes inside a
            // third-party iframe (measured 2026-10-28, from a real browser
            // capture: 202 -> challenge.js -> verify -> 202 until "Max challenge
            // attempts exceeded"), so the entry only supplies the href and the
            // page renders it as a new-tab link.
            imdb: {
                label: "IMDb",
                movie_url: "https://www.imdb.com/title/{imdb}/",
                tv_url: "https://www.imdb.com/title/{imdb}/",
                tv_series_url: "https://www.imdb.com/title/{imdb}/",
                id_type: "imdb"
            },
            tmdb: {
                label: "TMDB",
                movie_url: "https://www.themoviedb.org/movie/{tmdb}",
                tv_url: "https://www.themoviedb.org/tv/{tmdb}/season/{season}/episode/{episode}",
                tv_series_url: "https://www.themoviedb.org/tv/{tmdb}",
                id_type: "tmdb",
                is_external: true
            },
            epguides: {
                label: "EpGuides",
                tv_url: "https://epguides.com/{epguides}/",
                tv_series_url: "https://epguides.com/{epguides}/",
                id_type: "epguides",
                is_external: true
            }
        };

        // EpGuides' own site search is a Google Custom Search; it is the link for
        // a series whose page the feed could not resolve. Never
        // `epguides.com/search/?q=` — that page ignores its `q` parameter.
        const EPGUIDES_CSE_URL = "https://www.google.com/cse";
        const EPGUIDES_CSE_CX = "006364566242780170875:hrcq-leun10";

        // Ordered by how noisy a click is, then by what a TMDb id alone can play:
        // the two popup-free servers lead — medmedia03, and cdnm.ink, the only
        // others a real-browser sweep (2026-11-11) found opening no popups —
        // then the ad-bearing embeds in their previous order (vidspark slots
        // in there, one popup per play), then the two that read the id out of
        // the IMDb slot (`needs_imdb`), with VidLink — popup-bearing like the
        // rest, back in the row — as the final button.
        const DEFAULT_SERVERS = ["medmedia03", "cdnm", "cinesrc", "vidsrc_buzz", "vembed", "vidnest", "vidfast", "2embed", "vidspark", "vidsrc", "vidapi", "vidlink"];

        // Everything below goes into an iframe src or an href, so a value from
        // the query string is accepted only in the shape the ids really have:
        // digits for TMDb and season/episode, `tt` + digits for IMDb, an
        // EpGuides slug of letters, digits, `_` and `-`. Anything else is
        // dropped, and the entry that would have needed it is not built.
        function digits(value) {
            return value && /^\d+$/.test(value) ? value : null;
        }

        function imdbId(value) {
            if (!value) return null;
            const id = value.startsWith('tt') ? value : 'tt' + value;
            return /^tt\d+$/.test(id) ? id : null;
        }

        function epguidesSlug(value) {
            // Underscore is part of the real slugs — the resolver emits
            // `DoctorWho_2005`, `Office_US`, `Diplomat_UK` — so it must pass.
            return value && /^[A-Za-z0-9_-]+$/.test(value) ? value : null;
        }

        function parseSeasonEpisodeFromTitle(title) {
            if (!title) return { season: null, episode: null };
            let m = title.match(/S(\d{1,2})\s*E(\d{1,2})/i);
            if (m) return { season: digits(m[1]), episode: digits(m[2]) };
            m = title.match(/\b(\d{1,2})x(\d{1,2})\b/i);
            if (m) return { season: digits(m[1]), episode: digits(m[2]) };
            return { season: null, episode: null };
        }

        function parseYearFromTitle(title) {
            if (!title) return null;
            const m = title.match(/\b(19\d{2}|20\d{2})\b/);
            return m ? m[1] : null;
        }

        function getParams() {
            const params = new URLSearchParams(window.location.search);
            const tmdb = digits(params.get('tmdb') || params.get('id') || params.get('movie') || params.get('tv'));
            const title = params.get('title') || '';
            let season = digits(params.get('season') || params.get('s'));
            let episode = digits(params.get('episode') || params.get('e'));
            if ((!season || !episode) && title) {
                const parsed = parseSeasonEpisodeFromTitle(title);
                if (!season) season = parsed.season;
                if (!episode) episode = parsed.episode;
            }
            let year = digits(params.get('year') || '');
            if (!year && title) {
                year = parseYearFromTitle(title);
            }
            return {
                tmdb,
                imdb: imdbId(params.get('imdb') || params.get('tt')),
                type: (params.get('type') || params.get('media') || 'movie').toLowerCase(),
                season,
                episode,
                title,
                year,
                epguides: epguidesSlug(params.get('epguides')) || '',
                servers: params.get('servers') ? params.get('servers').split(',').map(s => s.trim()).filter(Boolean) : null
            };
        }

        function isTvType(type) {
            return type === 'tv' || type === 'series' || type === 'show';
        }

        function trailerUrl(title, year) {
            let query = title || '';
            if (year && !/\b(?:19|20)\d{2}\b/.test(query)) {
                query = query + ' ' + year;
            }
            return 'https://www.youtube.com/results?search_query='
                + encodeURIComponent(query) + '+preview%7Cpromo%7Ctrailer+-fake+-fan&sp=EgIYAQ%253D%253D';
        }

        function epguidesSearchUrl(query) {
            return EPGUIDES_CSE_URL + '?cx=' + EPGUIDES_CSE_CX + '&q=' + encodeURIComponent(query + ' epguides');
        }

        // The page to browse when the player was opened with nothing to play:
        // TMDb's movie list. It is also what the TMDB button points at in that
        // state, so the button is never missing an id to build around.
        const TMDB_BROWSE_URL = 'https://www.themoviedb.org/movie';

        function tmdbSearchUrl(title) {
            return 'https://www.themoviedb.org/search?query=' + encodeURIComponent(title);
        }

        // TMDb keeps its own trailer list per title, which is what a viewer wants
        // after picking a movie or series: official clips, not a YouTube search.
        function tmdbVideosUrl(params) {
            if (!params.tmdb) return null;
            const kind = isTvType(params.type) ? 'tv' : 'movie';
            return 'https://www.themoviedb.org/' + kind + '/' + params.tmdb
                + '/videos?active_nav_item=Trailers';
        }

        // A TMDb title page is `/movie/<id>[-slug]` or `/tv/<id>[-slug]`, and a
        // series narrows to `/season/<n>[/episode/<m>]`. The slug is hyphenated
        // and never carries a slash, so `(?:-[^/]*)?` cannot eat `/season` — that
        // is what keeps `tv/1416/season/23` from reading 23 as part of the slug.
        const TMDB_PAGE_URL_RE = /^https?:\/\/(?:www\.)?themoviedb\.org\/(movie|tv)\/(\d+)(?:-[^/?#]*)?(?:\/season\/(\d+)(?:\/episode\/(\d+))?)?(?:\/|$|#|\?)/i;

        function parseTmdbPageUrl(raw) {
            const m = TMDB_PAGE_URL_RE.exec((raw || '').trim());
            if (!m) return null;
            return {
                tmdb: digits(m[2]),
                type: m[1].toLowerCase() === 'tv' ? 'tv' : 'movie',
                season: digits(m[3]),
                episode: digits(m[4])
            };
        }

        // The page-URL row is only worth a line while the frame holds a TMDb page,
        // because that is the only address "Get the TMDb id" parses parameters out of.
        // Which page the viewer clicks on to *inside* the frame cannot be known
        // here — the same-origin policy keeps a cross-origin frame's address from
        // its embedder — so the row knows about the navigations the player makes
        // itself, and `trackFrame` tells it when the viewer has made one.
        const TMDB_HOST_RE = /^(?:www\.)?themoviedb\.org$/i;

        function framesTmdb(url) {
            try {
                return TMDB_HOST_RE.test(new URL(url).hostname);
            } catch {
                return false;
            }
        }

        // The frame is a black box, and the address it shows is the one thing
        // this page cannot read: a cross-origin page's `location` is write-only
        // from its embedder and its document unreadable, and `src` goes on
        // reporting whatever this page last assigned even after the viewer has
        // clicked through to another title (measured 2026-11-01 against
        // themoviedb.org: `contentWindow.location.href` throws SecurityError
        // while the `src` attribute still named the landing page five clicks
        // back). The one thing that does cross the boundary is the frame's
        // `load` event: it fires for the viewer's own navigations too, carrying
        // no address. That is still enough to retire the stale id — a load this
        // page did not cause means the address it assigned is no longer the
        // page on screen, so "Get the TMDb id" stops treating it as current.
        function trackFrame(player) {
            let assigned = null;
            let pending = 0;
            let moved = false;
            const movedWatchers = [];
            const assignWatchers = [];

            player.addEventListener('load', () => {
                if (pending > 0) {
                    // The load of the address this page put there: one follows
                    // an assignment, and nothing else in the page can tell it
                    // from the viewer's own click.
                    pending -= 1;
                    return;
                }
                moved = true;
                movedWatchers.forEach(fn => fn());
            });

            return {
                // Armed before `src` is set, so its own load is counted and the
                // next one is known to be the viewer's. At most one is ever
                // outstanding: an assignment made while the previous document is
                // still loading need not produce a load of its own — measured, an
                // embed assigned during the page's own load fires none — and a
                // counter that kept adding would swallow the viewer's next click
                // for good, which is the stale id again.
                assign(url) {
                    assigned = url;
                    pending = 1;
                    moved = false;
                    assignWatchers.forEach(fn => fn(url));
                },
                assignedAddress() {
                    return assigned;
                },
                hasMoved() {
                    return moved;
                },
                onMoved(fn) {
                    movedWatchers.push(fn);
                },
                onAssign(fn) {
                    assignWatchers.push(fn);
                }
            };
        }

        // Two addresses name the same TMDb page when they parse to the same
        // ids: the slug and the trailing path are decoration, and `movie/550`
        // and `movie/550-fight-club` are the page the frame was handed.
        function sameTmdbPage(a, b) {
            return Boolean(a && b)
                && a.type === b.type
                && a.tmdb === b.tmdb
                && (a.season || '') === (b.season || '')
                && (a.episode || '') === (b.episode || '');
        }

        // Reading the page the viewer has navigated to *inside* the frame. The
        // same-origin policy hides a cross-origin frame's location from this page
        // (`src` is only where the frame started, and `contentWindow.location`
        // throws), so the one way to learn it is for code running *inside* the
        // frame to say it. `tmdb-frame-reporter.user.js` beside this page is that
        // code: a userscript the viewer installs, which answers
        // `rss-player:locate` with `rss-player:location` and its own
        // `location.href`.
        //
        // The question goes out at click time rather than the answer being pushed
        // on every navigation, so an answer cannot be older than the click, and a
        // page reached by a link, by `history.pushState` or by the back button is
        // all the same to it. The `targetOrigin` pins the question to TMDb:
        // anywhere else the browser drops it.
        //
        // None of this is required. With no reporter installed the button keeps
        // the box and the clipboard, which `trackFrame` stops from replaying the
        // page the frame started on.
        const TMDB_FRAME_ORIGINS = ['https://www.themoviedb.org', 'https://themoviedb.org'];
        const FRAME_LOCATE = 'rss-player:locate';
        const FRAME_LOCATION = 'rss-player:location';
        // Long enough for a userscript to answer, short enough that a viewer
        // without one waits on nothing: an installed reporter answers in a few
        // milliseconds.
        const FRAME_ANSWER_MS = 500;
        const pendingLocates = new Map();
        let frameReporterSeen = false;
        let locateSeq = 0;

        window.addEventListener('message', (event) => {
            const frame = document.getElementById('player');
            // Three checks, none of them optional: it came from the frame, from a
            // TMDb origin, and in the one shape asked for. A message from this
            // page, or from any other tab, says nothing about the frame.
            if (!frame || event.source !== frame.contentWindow) return;
            if (!TMDB_FRAME_ORIGINS.includes(event.origin)) return;
            const data = event.data;
            if (!data || data.type !== FRAME_LOCATION) return;
            if (typeof data.href !== 'string' || data.href.length > 2048) return;
            frameReporterSeen = true;
            const settle = pendingLocates.get(data.id);
            if (settle) {
                pendingLocates.delete(data.id);
                settle(data.href);
            }
        });

        // Resolves with the frame's current address, or null when nothing in the
        // frame answers within `timeoutMs`.
        function askFrameLocation(timeoutMs) {
            const frame = document.getElementById('player');
            if (!frame || !frame.contentWindow) return Promise.resolve(null);
            return new Promise((resolve) => {
                const id = ++locateSeq;
                const timer = setTimeout(() => {
                    pendingLocates.delete(id);
                    resolve(null);
                }, timeoutMs);
                pendingLocates.set(id, (href) => {
                    clearTimeout(timer);
                    resolve(href);
                });
                TMDB_FRAME_ORIGINS.forEach((origin) => {
                    frame.contentWindow.postMessage({ type: FRAME_LOCATE, id }, origin);
                });
            });
        }

        // The path of a page that carries no id, for the message that says so:
        // the viewer needs to see *which* page the answer is about.
        function tmdbPagePath(href) {
            try {
                const url = new URL(href);
                const path = url.pathname + url.search;
                return path.length > 60 ? path.slice(0, 57) + '\u2026' : path;
            } catch {
                return 'unreadable address';
            }
        }

        function buildUrl(serverId, params) {
            const server = PLAYER_SERVERS[serverId];
            if (!server) return null;

            const { tmdb } = params;
            // Providers that take IMDb ids also accept a tt-prefixed TMDb id and
            // map it themselves, which is what feeds with no IMDb id resolve to.
            const imdb = params.imdb || (tmdb ? 'tt' + tmdb : null);
            const epguides = params.epguides ? encodeURIComponent(params.epguides) : null;

            let rawId;
            if (server.id_type === 'imdb') {
                rawId = params.imdb;
            } else if (server.id_type === 'imdb_or_tmdb') {
                rawId = imdb || tmdb;
            } else if (server.id_type === 'epguides') {
                rawId = epguides;
            } else {
                rawId = tmdb;
            }
            if (!rawId) return null;

            const isTv = isTvType(params.type);
            let hasEpisode = isTv && params.season && params.episode;
            // If it's TV but no episode specified, try to use S01E01 as fallback for servers that need it
            let season = params.season;
            let episode = params.episode;
            if (isTv && !hasEpisode) {
                // For servers that only have episode-specific URLs, try S01E01
                if (server.tv_url && !server.tv_series_url) {
                    season = season || '1';
                    episode = episode || '1';
                    hasEpisode = true;
                }
            }
            const template = isTv
                ? (hasEpisode ? server.tv_url : server.tv_series_url)
                : server.movie_url;
            if (!template) return null;

            // Function replacers, so a `$` in an id or title is not read as a
            // replacement pattern.
            const values = {
                '{tmdb}': tmdb || '',
                '{imdb}': imdb || '',
                '{epguides}': epguides || '',
                '{season}': season || '',
                '{episode}': episode || '',
                '{title}': encodeURIComponent(params.title || '')
            };
            return template.replace(
                /\{tmdb\}|\{imdb\}|\{epguides\}|\{season\}|\{episode\}|\{title\}/g,
                (key) => values[key]
            );
        }

        // The one writer of player parameters, so the manual form and "Get the
        // TMDb id" produce the same shareable URL. A season may go in without an
        // episode — that is a TMDb season landing page, and `buildUrl` lands such
        // a request on the series or its first episode — but the form refuses the
        // half marker, because nothing the feed pipeline writes carries one.
        function playerQuery({ tmdb, imdb, type, season, episode }) {
            const query = new URLSearchParams();
            if (tmdb) query.set('tmdb', tmdb);
            if (imdb) query.set('imdb', imdb);
            query.set('type', type === 'tv' ? 'tv' : 'movie');
            if (season) query.set('season', season);
            if (episode) query.set('episode', episode);
            // No `title`: it belongs to whatever the ids name, and carrying a
            // stale one over to new ids would mislabel the header and the
            // trailer search.
            return query.toString();
        }

        // The manual lookup is the query string made editable: it is prefilled
        // from the current parameters and submits new ones, so the page stays
        // the single source of truth for what it is playing and the result is a
        // URL worth sharing. It never touches the iframe directly.
        function initManual(params, frame) {
            const form = document.getElementById('manual');
            if (!form) return;
            const fields = form.elements;
            const episodeFields = document.getElementById('manualEpisode');
            const hint = document.getElementById('manualHint');
            const FRAME_MOVED = 'The frame moved - copy or paste the address of the page you are on.';

            // The row follows the frame. An address it holds when the frame
            // moves on names the page the viewer left, so it is dropped rather
            // than kept: a kept address is what the button used to read back
            // while the frame was already showing something else.
            frame.onMoved(() => {
                // The box named the page the frame has left, so it goes either way.
                // The hint does not: with a reporter inside the frame the next click
                // asks it and the answer replaces the box, so telling the viewer to
                // go and copy an address would be noise.
                fields.pageurl.value = '';
                // Nor may a move overwrite an answer the viewer just asked for. A
                // load can arrive after the click (the frame's own error page, a
                // slow redirect), and it describes the state the click already
                // reported on; a refusal read for half a second and then replaced
                // by "the frame moved" is worse than saying nothing.
                if (!frameReporterSeen
                        && (!hint.textContent || hint.textContent === FRAME_MOVED)) {
                    hint.textContent = FRAME_MOVED;
                }
            });
            // The other direction: the player put a page in the frame itself, so
            // the row starts empty instead of carrying the address of whatever
            // the frame showed before.
            frame.onAssign(() => {
                fields.pageurl.value = '';
                hint.textContent = '';
            });

            fields.tmdb.value = params.tmdb || '';
            fields.imdb.value = params.imdb || '';
            fields.season.value = params.season || '';
            fields.episode.value = params.episode || '';
            fields.type.value = isTvType(params.type) ? 'tv' : 'movie';
            const syncEpisodeFields = () => {
                episodeFields.hidden = fields.type.value !== 'tv';
            };
            fields.type.addEventListener('change', syncEpisodeFields);
            syncEpisodeFields();

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                // An address in the box is a lookup the box already answered, so it
                // wins over the ids still in the fields: a click on Load, or Enter in
                // the box, used to reload on the id from before the page was read.
                if (parseTmdbPageUrl(fields.pageurl.value)) {
                    grab(false);
                    return;
                }
                const raw = (name) => fields[name].value.trim();
                // The page's own allowlists decide what it can read back, so the
                // form refuses anything they would reject. That is the real
                // guarantee, not the `pattern` attributes: a control that is not
                // rendered — season and episode after flipping back to Movie —
                // is skipped by constraint validation and would submit anyway.
                const tmdb = digits(raw('tmdb'));
                const imdb = imdbId(raw('imdb'));
                const season = digits(raw('season'));
                const episode = digits(raw('episode'));
                const values = { tmdb, imdb, season, episode };
                if (Object.entries(values).some(([name, ok]) => raw(name) && ok === null)) {
                    hint.textContent = 'TMDb, season and episode are digits; IMDb is tt plus digits.';
                    return;
                }
                if (!tmdb && !imdb) {
                    hint.textContent = 'Enter a TMDb or IMDb id.';
                    return;
                }
                if (Boolean(season) !== Boolean(episode)) {
                    // Half a marker is a series landing page, not an episode, and
                    // the links the pipeline writes never carry one alone.
                    hint.textContent = 'Season and episode go together.';
                    return;
                }
                hint.textContent = '';
                window.location.search = playerQuery({
                    tmdb,
                    imdb,
                    type: fields.type.value,
                    season,
                    episode
                });
            });

            // "Get the TMDb id" is the framed TMDb site made reachable as player
            // parameters. The URL of a page open inside this iframe cannot be read
            // from here — the same-origin policy keeps a cross-origin frame's
            // address from its embedder — so the control takes the URL from the
            // field on the row above, and from the clipboard when the field is
            // empty. Whatever the clipboard held goes into that field, because an
            // address that is never shown is a stale address that cannot be seen:
            // the clipboard keeps the last thing copied long after the frame has
            // moved on, and every click then reloads the title it already plays.
            // `live` is a click on the button itself, which may ask the frame for
            // the page it is on; the Load row's redirect into an address the box
            // already holds (`grab(false)`) never does.
            const grab = async (live) => {
                // Getting the id owns the whole lookup, so it clears every field before it
                // reads anything: the row can then never end up showing two
                // titles — the id it loaded and one left over from the page the
                // viewer moved on from. A refusal leaves the row empty, which is
                // the honest state; the frame keeps playing until something
                // parses.
                fields.tmdb.value = '';
                fields.imdb.value = '';
                fields.season.value = '';
                fields.episode.value = '';
                fields.type.value = 'movie';
                syncEpisodeFields();
                let raw;
                let fromFrame = false;
                let copied = false;
                // A reporter that answered before is asked again, and its answer
                // is final: it is the page on screen, where the box and the
                // clipboard are only ever what was typed or copied. With none
                // installed the click asks nobody and waits for nothing — the
                // page load already asked once, and silence then is silence now.
                const liveHref = live && frameReporterSeen
                    ? await askFrameLocation(FRAME_ANSWER_MS)
                    : null;
                if (liveHref !== null) {
                    raw = liveHref.trim();
                    fromFrame = true;
                    fields.pageurl.value = raw;
                } else if (live && frameReporterSeen) {
                    // A reporter answered before and is silent now, so the frame
                    // is on a page it cannot run on. Nothing older may stand in
                    // for that page: no id is the honest answer.
                    hint.textContent = 'The TMDb frame did not answer - let the page finish loading and try again, or paste its URL.';
                    return;
                } else {
                    raw = fields.pageurl.value.trim();
                    // The box is the viewer's own statement of which page they are
                    // looking at, so it is taken as given. The clipboard is not: it
                    // holds whatever was copied last, and the address copied before
                    // the frame was moved is the page the frame *started* on.
                    if (!raw) {
                        if (!navigator.clipboard || !navigator.clipboard.readText) {
                            hint.textContent = 'Paste the TMDb page URL into the field.';
                            return;
                        }
                        try {
                            raw = (await navigator.clipboard.readText()).trim();
                        } catch {
                            // Denied or empty: reading the clipboard needs a
                            // permission the user can revoke at any time.
                            hint.textContent = 'Clipboard unreadable - paste the TMDb page URL instead.';
                            return;
                        }
                        fields.pageurl.value = raw;
                        copied = true;
                    }
                }
                const found = parseTmdbPageUrl(raw);
                if (!found || !found.tmdb) {
                    // A TMDb address that carries no id is still an answer, and a
                    // different one from "that is not TMDb": search, list, person
                    // and the plain browse pages have no id to load, so the row
                    // says exactly that, naming the page when the frame reported
                    // it, instead of leaving the old id standing.
                    hint.textContent = !raw
                        ? 'Nothing to read — paste or copy a TMDb page URL first.'
                        : fromFrame
                            ? `No movie or TV id on this TMDb page (${tmdbPagePath(raw)}).`
                            : framesTmdb(raw)
                                ? 'That TMDb page has no movie or TV id.'
                                : 'Not a TMDb movie or TV page URL.';
                    return;
                }
                // The frame has been moved by the viewer and this address is
                // still the page the player handed it — the landing page, not the
                // page on screen. That is the id this button kept returning, so
                // it is refused rather than loaded a second time; the address
                // stays in the box, because a stale address has to be visible to
                // be corrected.
                if (copied && frame.hasMoved()
                        && sameTmdbPage(parseTmdbPageUrl(frame.assignedAddress() || ''), found)) {
                    hint.textContent = 'That is the page the frame started on - copy the address of the page you are on now.';
                    return;
                }
                const query = playerQuery(found);
                // What is left is only what the address says, and the Load row
                // shows it: the result is reviewable before the frame follows.
                // The row is filled whether or not the address changes the page —
                // it is what the fields say now.
                fields.tmdb.value = found.tmdb;
                fields.type.value = found.type;
                fields.season.value = found.season || '';
                fields.episode.value = found.episode || '';
                syncEpisodeFields();
                if (query === window.location.search.slice(1)) {
                    // Nothing to reload, and the field says why: this is the
                    // address the page is already playing.
                    hint.textContent = `Already loaded: ${found.type}/${found.tmdb}`;
                    return;
                }
                hint.textContent = '';
                window.location.search = query;
            };

            const grabButton = document.getElementById('grabPage');
            if (grabButton) grabButton.addEventListener('click', () => grab(true));
        }

        function init() {
            const params = getParams();
            const serverButtons = document.getElementById('serverButtons');
            const player = document.getElementById('player');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const info = document.getElementById('info');
            const externalLinks = document.getElementById('externalLinks');

            const listed = params.servers && params.servers.length ? params.servers.filter(s => PLAYER_SERVERS[s]) : DEFAULT_SERVERS;
            // A server whose id slot is IMDb has nothing real to read when the
            // query string carries only a TMDb id: `buildUrl` falls back to
            // `tt<tmdb>`, a TMDb number wearing an IMDb prefix. Those two do not
            // resolve it, so the button is dropped rather than offered on a guess.
            // The same goes for a server with no template for this type — cdnm.ink
            // serves movies only — whose `buildUrl` would return null and leave a
            // button that loads a blank frame.
            const isTv = isTvType(params.type);
            const servers = listed.filter(id => {
                const server = PLAYER_SERVERS[id];
                if (!params.imdb && server.needs_imdb) return false;
                return isTv ? Boolean(server.tv_url || server.tv_series_url) : Boolean(server.movie_url);
            });
            // Watches the frame from the outside: which address this page gave
            // it, and whether it has since gone somewhere else without saying
            // where. Nothing here can read that address — see `trackFrame`.
            const frame = trackFrame(player);
            initManual(params, frame);
            // An id is only what a media server needs to build an embed. Opened
            // with no parameters the page still has a job — browse TMDb and turn a
            // page into parameters with "Get the TMDb id" — so it loads TMDb's
            // movie list instead of going blank, and shows no server row.
            const hasIds = Boolean(params.tmdb || params.imdb);
            if (hasIds && servers.length === 0) {
                error.style.display = 'none';
                loading.style.display = 'none';
                player.style.display = 'none';
                return;
            }

            const hasEpisode = isTv && params.season && params.episode;
            const yearShown = params.year && !/\b(?:19|20)\d{2}\b/.test(params.title) ? ` (${params.year})` : '';
            const ids = params.tmdb ? 'TMDB:' + params.tmdb : (params.imdb || '');
            info.textContent = hasIds ? [
                (params.title ? params.title + yearShown : (isTv ? 'TV' : 'Movie')),
                hasEpisode ? `S${params.season}E${params.episode}` : '',
                ids
            ].filter(Boolean).join(' • ') : 'Browse TMDb, then use the page URL box to load it here';

            // Only the two button rows carry an active state; the manual form's
            // Load and Get the TMDb id share their shape but never their highlight.
            const markActive = (btn) => {
                document.querySelectorAll('.server-buttons .server-btn, .external-links .server-btn')
                    .forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };

            function loadUrl(url, isExternal) {
                loading.style.display = 'block';
                error.style.display = 'none';
                // The row below the ids belongs to the frame: it comes back for a
                // TMDb page, where there is a URL to read, and stays out for an
                // embed, where there is not.
                const pageRow = document.querySelector('.manual-page');
                if (pageRow) pageRow.hidden = !framesTmdb(url);
                // A framed page that refuses to be framed is indistinguishable
                // from a blank one, so the metadata buttons always offer the same
                // destination in a new tab.
                const fallback = document.getElementById('openFallback');
                if (isExternal) {
                    fallback.href = url;
                    fallback.style.display = 'block';
                } else {
                    fallback.style.display = 'none';
                }
                // Armed before `src`, so the load this assignment causes is
                // known to be this page's own and the next one is the viewer's.
                frame.assign(url);
                player.src = url;
                player.onload = () => {
                    loading.style.display = 'none';
                    // A TMDb page in the frame, the viewer's own clicks included
                    // (this handler stays bound), finds out whether a reporter is
                    // inside it: its answer is what flips `frameReporterSeen`, so
                    // the next click's silence can be read as "no reporter here"
                    // rather than "not answered yet".
                    if (framesTmdb(url)) askFrameLocation(FRAME_ANSWER_MS);
                };
            }

            function loadServer(serverId) {
                const url = buildUrl(serverId, params);
                if (!url) {
                    loading.style.display = 'none';
                    error.style.display = 'block';
                    error.querySelector('div').textContent = `Cannot build URL for ${PLAYER_SERVERS[serverId].label} with given parameters.`;
                    return;
                }
                loadUrl(url, PLAYER_SERVERS[serverId].is_external);
            }

            const activate = (serverId, btn) => {
                markActive(btn);
                loadServer(serverId);
            };

            // The row is grouped by what a frame can hold: the iframe entries
            // first (EpGuides for a series, then TMDB), the new-tab ones after
            // (IMDb, then Trailer), each marked with an arrow. Grouping is the
            // point, so the order below is part of the layout.
            //
            // EpGuides and TMDB frame like any embed. Trailer and IMDb cannot:
            // youtube.com sends `x-frame-options: SAMEORIGIN`, and IMDb's bot
            // challenge cannot complete inside a frame (see PLAYER_SERVERS). A
            // series whose slug the feed never resolved loses its place in the
            // iframe group — the EpGuides site search lives on google.com, which
            // refuses framing as well — and never the guessed
            // `epguides.com/<title with +>` URL, which is not a page.
            let tmdbButton = null;
            if (externalLinks) {
                const addFrameButton = (label, url) => {
                    if (!url) return null;
                    const btn = document.createElement('button');
                    btn.className = 'server-btn';
                    btn.textContent = label;
                    btn.onclick = () => {
                        markActive(btn);
                        loadUrl(url, true);
                    };
                    externalLinks.appendChild(btn);
                    return btn;
                };
                const addLink = (label, href) => {
                    const a = document.createElement('a');
                    a.className = 'external-link';
                    a.href = href;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.textContent = label + ' \u2197';
                    externalLinks.appendChild(a);
                };
                if (isTv) {
                    if (params.epguides) {
                        addFrameButton(PLAYER_SERVERS.epguides.label, buildUrl('epguides', params));
                    } else if (params.title) {
                        addLink('EpGuides', epguidesSearchUrl(params.title));
                    }
                }
                // Always visible, whatever the URL carries: a known TMDb id frames
                // that title, a title with no id frames TMDb's search for it, and
                // nothing at all frames the browse list the page opened on.
                tmdbButton = addFrameButton(
                    PLAYER_SERVERS.tmdb.label,
                    params.tmdb ? buildUrl('tmdb', params)
                        : (params.title ? tmdbSearchUrl(params.title) : TMDB_BROWSE_URL)
                );
                addFrameButton('TMDb Trailer', tmdbVideosUrl(params));
                const imdbUrl = buildUrl('imdb', params);
                if (imdbUrl) addLink('IMDb', imdbUrl);
                if (params.title) addLink('Trailer', trailerUrl(params.title, params.year));
            }

            if (!hasIds) {
                // Browse mode: the frame is on TMDb and its button is the active
                // one, so the page reads as what it is showing.
                if (tmdbButton) {
                    markActive(tmdbButton);
                    loadUrl(TMDB_BROWSE_URL, true);
                }
                return;
            }

            servers.forEach((serverId, idx) => {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (idx === 0 ? ' active' : '');
                btn.textContent = PLAYER_SERVERS[serverId].label;
                btn.onclick = () => activate(serverId, btn);
                serverButtons.appendChild(btn);
            });

            loadServer(servers[0]);
        }

        window.onload = init;

        // Update page title dynamically based on media type and title.
        // The TMDb read-access key is not committed: `.github/workflows/
        // update.yml` replaces this placeholder in the copy it publishes. A
        // page opened straight from the repository keeps the placeholder, the
        // lookup is skipped, and the title falls back to "Movie (id)".
        const TMDB_API_KEY = '__PLAYER_TMDB_API_KEY__';
        const TMDB_LANGUAGE = 'en';
        const TMDB_CACHE_KEY = 'player_tmdb_cache';

        function getCachedTitle(tmdbId) {
            try {
                const raw = localStorage.getItem(TMDB_CACHE_KEY);
                if (!raw) return null;
                const cache = JSON.parse(raw);
                if (!cache.data || !cache.ts) return null;
                // 30-day expiry
                if (Date.now() - cache.ts > 30 * 24 * 60 * 60 * 1000) {
                    localStorage.removeItem(TMDB_CACHE_KEY);
                    return null;
                }
                return cache.data[tmdbId];
            } catch {
                return null;
            }
        }

        function setCachedTitle(data) {
            try {
                const raw = localStorage.getItem(TMDB_CACHE_KEY);
                const cache = raw ? JSON.parse(raw) : { data: {}, ts: Date.now() };
                Object.assign(cache.data, data);
                localStorage.setItem(TMDB_CACHE_KEY, JSON.stringify(cache));
            } catch { /* ignore quota errors */ }
        }

        async function fetchTmdbTitle(tmdbId, tmdbType) {
            if (!tmdbId) return null;
            const cached = getCachedTitle(tmdbId);
            if (cached) return cached;
            // Placeholder still in place (repo copy, not the published one): no
            // key to send, so skip the request instead of asking TMDb to 401.
            if (!TMDB_API_KEY || TMDB_API_KEY.startsWith('__')) return null;
            try {
                const url = new URL(`https://api.themoviedb.org/3/${tmdbType === 'tv' ? 'tv' : 'movie'}/${tmdbId}`);
                url.searchParams.set('api_key', TMDB_API_KEY);
                url.searchParams.set('language', TMDB_LANGUAGE);
                const resp = await fetch(url, { cache: 'no-store' });
                if (!resp.ok || resp.status === 404) return null;
                const json = await resp.json();
                if (json.title || json.name) {
                    const title = (json.title || json.name).trim();
                    setCachedTitle({ [tmdbId]: title });
                    return title;
                }
            } catch {
                // Network errors are silent — the fallback title still works
            }
            return null;
        }

        async function resolveAndSetTitle() {
            const params = new URLSearchParams(window.location.search);
            let title = params.get('title');
            // Only resolve when no explicit title but we have a TMDb id + type
            if (!title) {
                const tmdbId = params.get('tmdb');
                const type = params.get('type') || 'movie';
                if (tmdbId && (type === 'movie' || type === 'tv')) {
                    title = await fetchTmdbTitle(tmdbId, type);
                }
            }
            let newTitle = 'Player - RSS Generator';
            if (title) {
                newTitle = title + ' - Player - RSS Generator';
            } else if (params.get('type')) {
                const id = params.get('tmdb') || params.get('imdb') || '';
                const mediaType = params.get('type').charAt(0).toUpperCase() + params.get('type').slice(1);
                newTitle = (id ? `${mediaType} (${id})` : mediaType) + ' - Player - RSS Generator';
            }
            document.getElementById('pageTitle').textContent = newTitle;
        }

        // Update title on initial load and when URL changes (e.g., via back/forward)
        window.addEventListener('load', () => {
            // Async so the UI renders before the network call starts
            resolveAndSetTitle();
        });
        window.addEventListener('popstate', () => {
            setTimeout(resolveAndSetTitle, 0);
        });
    </script>
</body>
</html>
